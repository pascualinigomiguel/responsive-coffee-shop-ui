<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Kapihan &amp; Co. — Timeless Local Brews</title>
  <desc id="desc">A warm specialty coffee poster celebrating Philippine single-origin coffee and local growers.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b160f"/><stop offset=".5" stop-color="#5b2c1c"/><stop offset="1" stop-color="#a85f35"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="44%" r="58%"><stop stop-color="#f7d79d" stop-opacity=".32"/><stop offset="1" stop-color="#c16b3b" stop-opacity="0"/></radialGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1ce"/><stop offset="1" stop-color="#e9b873"/></linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7e4326"/><stop offset="1" stop-color="#24100c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#160906" flood-opacity=".55"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="14" cy="20" r="1.2" fill="#fff" opacity=".12"/><circle cx="53" cy="62" r=".9" fill="#fff" opacity=".1"/><circle cx="71" cy="34" r=".7" fill="#fff" opacity=".1"/></pattern>
  </defs>
  <rect width="1200" height="1600" fill="url(#paper)"/>
  <ellipse cx="600" cy="700" rx="520" ry="570" fill="url(#halo)"/>
  <g fill="none" stroke="#e7b876" stroke-width="3" opacity=".6"><path d="M88 92h180M88 92v180M1112 1508H932M1112 1508v-180"/><circle cx="600" cy="770" r="470" stroke-dasharray="3 18" opacity=".5"/></g>

  <!-- botanical coffee branches -->
  <g fill="none" stroke="#d29b5e" stroke-width="8" stroke-linecap="round" opacity=".5">
    <path d="M130 1020c110-190 135-350 100-535"/><path d="M1070 1020c-110-190-135-350-100-535"/>
  </g>
  <g fill="#d9a669" opacity=".55"><ellipse cx="180" cy="610" rx="28" ry="62" transform="rotate(-42 180 610)"/><ellipse cx="255" cy="700" rx="28" ry="62" transform="rotate(42 255 700)"/><ellipse cx="1020" cy="610" rx="28" ry="62" transform="rotate(42 1020 610)"/><ellipse cx="945" cy="700" rx="28" ry="62" transform="rotate(-42 945 700)"/></g>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="600" y="190" fill="#f7d79d" font-size="27" letter-spacing="10" font-family="Arial, sans-serif" font-weight="700">SINGLE-ORIGIN · PHILIPPINE COFFEE</text>
    <text x="600" y="360" fill="url(#cream)" font-size="112" font-weight="700" filter="url(#shadow)">KAPIHAN</text>
    <text x="600" y="455" fill="#f3c783" font-size="72" font-style="italic">&amp; Co.</text>
    <path d="M355 505h490" stroke="#e9b873" stroke-width="3"/><circle cx="335" cy="505" r="5" fill="#e9b873"/><circle cx="865" cy="505" r="5" fill="#e9b873"/>
    <text x="600" y="570" fill="#fff0d0" font-size="34" letter-spacing="3">TIMELESS LOCAL BREWS,</text>
    <text x="600" y="620" fill="#f7c987" font-size="34" letter-spacing="3" font-style="italic">CRAFTED WITH PRIDE</text>
  </g>

  <!-- coffee cup -->
  <g transform="translate(600 885)" filter="url(#shadow)">
    <ellipse cx="0" cy="220" rx="260" ry="48" fill="#160a08" opacity=".4" filter="url(#soft)"/>
    <path d="M-220 -70h440l-30 310c-10 100-80 150-190 150s-180-50-190-150z" fill="url(#cream)" stroke="#f8d99c" stroke-width="8"/>
    <path d="M-216 -72h432c-9 75-85 112-216 112S-207 3-216-72z" fill="url(#coffee)" stroke="#f8d99c" stroke-width="8"/>
    <ellipse cx="0" cy="-70" rx="215" ry="45" fill="#32150e" stroke="#fbe0a8" stroke-width="6"/>
    <path d="M220 10c155-45 190 190 12 210" fill="none" stroke="#f5cf8c" stroke-width="38"/>
    <path d="M220 10c155-45 190 190 12 210" fill="none" stroke="#6f351f" stroke-width="21"/>
    <text x="0" y="170" fill="#6b311e" font-size="38" letter-spacing="7" font-weight="700">KAPIHAN</text>
    <text x="0" y="215" fill="#8a4b2b" font-size="20" letter-spacing="4">LOCAL • WARM • PROUD</text>
    <!-- steam -->
    <g fill="none" stroke="#ffe7b6" stroke-width="14" stroke-linecap="round" opacity=".75">
      <path d="M-100 -145c-45-70 50-90 0-175"/><path d="M0 -155c-45-80 55-105 4-205"/><path d="M100 -145c-45-70 50-90 0-175"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="1265" fill="#fff0d0" font-size="37" font-weight="700">FROM OUR LAND TO YOUR CUP</text>
    <text x="600" y="1320" fill="#f6c985" font-size="24" letter-spacing="3">BENGUET · SAGADA · LIPA</text>
    <rect x="335" y="1380" width="530" height="76" rx="38" fill="#f3d29a"/>
    <text x="600" y="1429" fill="#3b1b13" font-size="24" letter-spacing="3" font-weight="700">HTML · CSS · VANILLA JS</text>
    <text x="600" y="1525" fill="#f5d49c" font-size="18" letter-spacing="5" opacity=".9">SIP SLOWLY · STAY AWHILE</text>
  </g>
  <rect width="1200" height="1600" fill="url(#grain)" opacity=".35"/>
  <rect x="27" y="27" width="1146" height="1546" rx="8" fill="none" stroke="#f0c481" stroke-width="2" opacity=".7"/>
</svg>
